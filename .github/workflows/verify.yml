name: Verify one-click installer

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  official-dmg:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
          - macos-15-intel
          - macos-26
          - macos-26-intel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Environment
        run: |
          sw_vers
          uname -m
          xcode-select -p
      - name: Mach-O unit tests
        run: python3 tests/test_inject_macho.py -v
      - name: Official Shottr DMG end-to-end test
        run: ./tests/e2e_official_dmg.sh
